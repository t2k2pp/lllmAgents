name: CI

# 引き継ぎレビュー指摘: 緑テストが「macOS 開発機ローカル」止まりで、 Linux 経路の実行系が
# 未検証だった。 OS 別に型チェック＋テストを回し、 特に macOS=Seatbelt / Linux=bwrap の
# 統合テスト（環境依存で skip される）を各 runner で走らせて回帰を検出する。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-message:
    name: Commit message policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate introduced commit messages
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          POLICY_BASE_SHA: 1aed7fa86c93f9444b6039bbe5317e507cf758f2
        run: node scripts/validate-commit-messages.mjs --range "$BEFORE_SHA" "$AFTER_SHA" "$POLICY_BASE_SHA"

  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: 主開発環境かつ exe 配布ターゲット。Windows 固有コード
        # (git bash 検出 / icacls / SEA ビルド) の回帰を検出する (PR-06)。
        # サンドボックス統合テストは Windows では skip される設計 (WSL 前提)。
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Linux runner では bwrap を入れて Linux サンドボックスの統合テストを有効化する。
      # （sandbox 統合テストは bwrap/sandbox-exec が無ければ skip される設計）
      - name: Install bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat iproute2
      # ubuntu-latest は Ubuntu 24.04 で kernel.apparmor_restrict_unprivileged_userns=1 が
      # 既定。apt 版 bubblewrap は setuid なしで非特権 user namespace に依存するため、この
      # 制限下では bwrap が起動できず統合テストが失敗する。CI でだけ制限を解除し、bwrap FS
      # 隔離テストを skip（緑の嘘）にせず実ランタイムで走らせる。
      - name: Allow unprivileged user namespaces (Linux only)
        if: runner.os == 'Linux'
        # キーが無い旧カーネル（＝制限自体が無い）では失敗扱いにしない
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # tsc --noEmit + biome check (format 差分はエラー、lint は既存違反ルールを warn 運用 — PR-07)
      - name: Type check & lint
        run: npm run lint
      # 実測ベースの下限を vitest.config.ts で設定し、カバレッジ低下をCIで止める。
      - name: Test (with coverage report)
        run: npm run test:coverage
      # アプリ全体をモック LLM + 非TTYパイプモードで起動する E2E スモーク (PR-08)。
      # CPU 競合 flake を避けるためユニットテストと分離して直列実行する。
      - name: E2E smoke test
        run: npm run test:e2e
      - name: Real PTY startup / quit smoke (Linux and macOS)
        if: runner.os != 'Windows'
        run: npm run test:pty
      # 実行時依存の既知脆弱性 (High 以上) で fail させる (PR-05)。
      # devDependencies はビルド時のみ使うため対象外 (--omit=dev)。
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate npm package contents
        run: npm run validate:package

  package-smoke:
    name: Windows deploy / exe smoke
    needs: [commit-message, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build deploy directory and SEA executable
        run: npm run build:deploy
      - name: Smoke packaged entry points
        shell: pwsh
        run: |
          $exeVersion = & .\deploy\localllm.exe --version
          if ($LASTEXITCODE -ne 0 -or -not $exeVersion) { throw "localllm.exe --version failed" }
          if (Test-Path -LiteralPath '.\deploy\localllm.cjs') { throw 'non-equivalent CJS fallback must not be packaged' }
          if (-not (Test-Path -LiteralPath '.\deploy\agents\general-purpose.md')) { throw 'agent asset missing' }
          if (-not (Test-Path -LiteralPath '.\deploy\skills\product-quality-cycle\SKILL.md')) { throw 'skill asset missing' }
          if ($exeVersion -match 'commit unknown') { throw 'packaged commit is unknown' }
